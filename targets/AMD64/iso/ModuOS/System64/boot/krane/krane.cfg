title=KRANE Boot Menu
timeout=5
default=0

entry "(NTSoftware) ModuOS"
  search=\ModuOS\System64\mdsys.sqr
  kernel={search}\ModuOS\System64\mdsys.sqr
  module={search}\ModuOS\System64\initmod.tpk initmod.tpk
  cmdline=--debug=med
end


entry "Reboot to Firmware Setup"
  action=firmware
end

entry "Restart"
  action=reboot
end

entry "Shut Down"
  action=shutdown
end
