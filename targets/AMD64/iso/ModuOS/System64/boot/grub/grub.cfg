set timeout=5
set default=0

set gfxmode=1280x720x32,1280x720x32,auto
set gfxpayload=keep

insmod all_video
insmod gfxterm
terminal_input console
terminal_output gfxterm

if [ -f /ModuOS/System64/boot/grub/unicode.pf2 ]; then
    loadfont /ModuOS/System64/boot/grub/unicode.pf2
fi

set menu_color_normal=yellow/black
set menu_color_highlight=white/blue

# Standard
menuentry "NTS / ModuOS" {
    insmod ext2
    insmod multiboot2

    # Ensure the payload is kept right before booting
    set gfxpayload=keep

    search --no-floppy --set=root --file /ModuOS/System64/mdsys.sqr
    multiboot2 /ModuOS/System64/mdsys.sqr --debug=med
    module2 /ModuOS/System64/initmod.tpk initmod.tpk
    boot
}

# More options submenu
submenu "More ModuOS Options" {
    set menu_color_normal=yellow/black
    set menu_color_highlight=white/blue

    menuentry "NTS / ModuOS Compatibility Mode (100Hz)" {
        insmod multiboot2
        set gfxpayload=keep

        search --no-floppy --set=root --file /ModuOS/System64/mdsys.sqr
        multiboot2 /ModuOS/System64/mdsys.sqr --debug=med --pithz=100
        module2 /ModuOS/System64/initmod.tpk initmod.tpk
        boot
    }
}